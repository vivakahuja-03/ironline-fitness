<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>BMI calculator</h2>
        <p>A quick baseline check — not a diagnosis, just a starting point for picking a program.</p>
      </div>
    </div>

    <div class="bmi-card">
      <form id="bmiForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="units">Units</label>
            <select id="units" name="units">
              <option value="metric">Metric (kg / cm)</option>
              <option value="imperial">Imperial (lb / in)</option>
            </select>
          </div>
          <div class="field">
            <label for="weight" id="weightLabel">Weight (kg)</label>
            <input type="number" id="weight" name="weight" min="1" step="0.1" required />
            <p class="error-msg" id="weightError"></p>
          </div>
          <div class="field">
            <label for="height" id="heightLabel">Height (cm)</label>
            <input type="number" id="height" name="height" min="1" step="0.1" required />
            <p class="error-msg" id="heightError"></p>
          </div>
        </div>
        <button class="btn" type="submit">Calculate BMI</button>
      </form>

      <div class="bmi-result" id="bmiResult">
        <span class="value" id="bmiValue">--</span>
        <p id="bmiCategory"></p>
      </div>
    </div>
  </div>
</section>
