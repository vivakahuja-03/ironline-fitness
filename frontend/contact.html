  <nav class="nav">
    <a href="index.html" class="nav-brand">Iron<span>Line</span></a>
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">&#127769;</button>
      <button class="nav-toggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">&#9776;</button>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>

    </ul>
  </nav>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>Contact &amp; registration</h2>
        <p id="contactContext">Questions about membership, programs, or anything else — send us a message.</p>
      </div>
    </div>

    <form id="contactForm" class="form-grid" novalidate>
      <div class="field">
        <label for="cName">Full name</label>
        <input type="text" id="cName" required minlength="2" />
        <p class="error-msg" id="cNameError"></p>
      </div>
      <div class="field">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" required />
        <p class="error-msg" id="cEmailError"></p>
      </div>
      <div class="field">
        <label for="cPhone">Phone (optional)</label>
        <input type="tel" id="cPhone" placeholder="03xx xxxxxxx" />
        <p class="error-msg" id="cPhoneError"></p>
      </div>
      <div class="field">
        <label for="cSubject">Subject</label>
        <input type="text" id="cSubject" placeholder="e.g. Standard plan question" />
      </div>
      <div class="field">
        <label for="cMessage">Message</label>
        <textarea id="cMessage" required minlength="5"></textarea>
        <p class="error-msg" id="cMessageError"></p>
      </div>

      <button class="btn" type="submit">Send message</button>
      <p class="form-status" id="contactStatus"></p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 IronLine Fitness.</p>
    <p><a href="contact.html">Contact us</a> &middot; <a href="admin.html">Admin</a></p>
